<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Turnout · offline</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 15px/1.5 system-ui, sans-serif; }
  main { min-height: 100%; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 72px; height: 72px; }
  h1 { font: 600 13px/1 ui-monospace, monospace; letter-spacing: .3em; margin: 24px 0 8px; }
  p { color: #a3a3a3; margin: 0 0 20px; }
  button { background: #fff; color: #000; border: 0; border-radius: 999px; padding: 8px 18px; font: 500 13px system-ui; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div>
    <img src="/icons/icon-192.png" alt="">
    <h1>TURNOUT IS OFFLINE</h1>
    <p>The numbers are always live, so Turnout needs a connection.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</main>
</body>
</html>
